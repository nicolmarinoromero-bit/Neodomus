services:
  db:
    image: mysql:8.0
    container_name: neodomus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: neodomus
      MYSQL_USER: neodomus
      MYSQL_PASSWORD: neodomus123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neodomus_net

  api:
    build: ./be
    container_name: neodomus_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://neodomus:neodomus123@db:3306/neodomus?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-neodomus29@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      VERIFICATION_TOKEN_EXPIRE_HOURS: ${VERIFICATION_TOKEN_EXPIRE_HOURS:-24}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-10}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FRONTEND_VERIFY_EMAIL_PATH: /verify-email
      FRONTEND_RESET_PASSWORD_PATH: /reset-password
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./be:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - neodomus_net

  frontend:
    build: ./fe
    container_name: neodomus_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
    volumes:
      - ./fe:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - neodomus_net

volumes:
  mysql_data:

networks:
  neodomus_net:
    driver: bridge